name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run compile

      # Packaging is part of CI so a broken manifest fails here and not during a release.
      - run: npx vsce package

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: '*.vsix'
